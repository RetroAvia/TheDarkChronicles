<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable / maximum-scale were removed: blocking zoom fails WCAG
       1.4.4, and `touch-action: none` on <body> already stops accidental
       pinch-zoom during play without taking the control away from people who
       actually need it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="color-scheme" content="dark" />

  <title>The Dark Chronicles — RetroAvia</title>
  <meta name="description" content="Attraversa otto dimensioni digitali corrotte, raccogli i cristalli, sconfiggi l'Entità Suprema e sblocca codici sconto reali per RetroAvia." />

  <!-- ==== Social preview ==================================================
       IMPORTANTE: sostituisci https://the-dark-chronicles.vercel.app con il
       dominio definitivo dopo il primo deploy. og:image DEVE essere un URL
       assoluto: molti scraper (WhatsApp, Telegram, LinkedIn) non risolvono
       i percorsi relativi e mostrerebbero il link senza anteprima.
       ===================================================================== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RetroAvia" />
  <meta property="og:title" content="The Dark Chronicles — gioca e sblocca sconti RetroAvia" />
  <meta property="og:description" content="Otto dimensioni, un boss finale e due codici sconto veri da sbloccare. Si gioca dal browser, gratis." />
  <meta property="og:url" content="https://the-dark-chronicles.vercel.app/" />
  <meta property="og:image" content="https://the-dark-chronicles.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Dark Chronicles — 8 dimensioni da salvare, sconti veri da sbloccare" />
  <meta property="og:locale" content="it_IT" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Dark Chronicles — RetroAvia" />
  <meta name="twitter:description" content="Otto dimensioni, un boss finale e due codici sconto veri da sbloccare." />
  <meta name="twitter:image" content="https://the-dark-chronicles.vercel.app/og-image.png" />

  <!-- ==== Icons / installabilità ======================================== -->
  <link rel="icon" href="./icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dark Chronicles" />

  <!-- ==== Fonts ==========================================================
       Caricati in modo non bloccante: se Google Fonts è lento o irraggiungibile
       il gioco parte lo stesso con lo stack di fallback definito in theme.css.
       Per eliminare del tutto la dipendenza esterna (consigliato, anche lato
       GDPR) vedi la sezione "Font" del README.
       ===================================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" />
  </noscript>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="Area di gioco" role="img"></canvas>
    <div id="ui-root"></div>
    <!-- Only announcements (toasts, checkpoint messages) are live-regioned.
         The whole UI root used to carry aria-live, which made screen readers
         re-read every menu and every page of story text on each transition. -->
    <div id="ui-announcer" aria-live="polite" aria-atomic="true" class="ra-sr-only"></div>
  </div>

  <!-- Boot splash: removed by main.js as soon as the first frame is painted. -->
  <div id="boot-splash">
    <div class="boot-mark"></div>
    <p class="boot-title">THE DARK CHRONICLES</p>
    <p class="boot-sub">Sincronizzazione dimensionale…</p>
  </div>

  <noscript>
    <div class="ra-noscript">
      <h1>JavaScript disattivato</h1>
      <p>The Dark Chronicles è un gioco: per funzionare ha bisogno di JavaScript attivo. Attivalo e ricarica la pagina.</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
